name: Import V1.8 patch

on:
  push:
    branches: [main]
    paths:
      - 'v18-patch/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1.8 patch
        shell: bash
        run: |
          set -euo pipefail
          [ -f v18-patch/READY ] || exit 0
          cat v18-patch/chunk-* | base64 -d > /tmp/v18-patch.zip
          rm -rf /tmp/v18-patch
          mkdir -p /tmp/v18-patch
          unzip -q /tmp/v18-patch.zip -d /tmp/v18-patch
          cp /tmp/v18-patch/app/web/index.html app/web/index.html
          cp /tmp/v18-patch/app/web/app.js app/web/app.js
          cp /tmp/v18-patch/app/web/style.css app/web/style.css
          mkdir -p launcher docs
          cp /tmp/v18-patch/launcher/main.go launcher/main.go
          cp /tmp/v18-patch/launcher/README.md launcher/README.md
          cp /tmp/v18-patch/docs/update.json docs/update.json
          cp /tmp/v18-patch/VERSION VERSION
          cat /tmp/v18-patch/V18_CHANGELOG.md CHANGELOG.md > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md
          rm -rf v18-patch
          rm -f .github/workflows/import-v18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Manu Stream Radio V1.8 sources and updater'
          git push
