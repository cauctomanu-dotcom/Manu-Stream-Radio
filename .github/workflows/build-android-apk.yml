name: Build Android listener APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-listener-v1
    paths:
      - 'android-listener/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-listener assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-listener/app/build/outputs/apk/debug/app-debug.apk Manu-Stream-Radio-Android-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manu-Stream-Radio-Android-TEST
          path: Manu-Stream-Radio-Android-TEST.apk
          if-no-files-found: error
